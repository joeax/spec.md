# SPEC.md Schema Definition
# ----------------------------
# ID: specmd
# Version: 2026-07-28
#
# SPEC.md is a lightweight, agent-optimized specification format for describing
# any software component, application, or system. Specs are markdown files
# with a YAML frontmatter block.
#
# Filename: SPEC.md
#
# SCHEMA NOTATION
#   type?        = optional
#   [type]       = list of type
#   "a" | "b"    = string enum
#
# SPECTRUM PRINCIPLE
#   Every section exists on a spectrum from conceptual to concrete.
#   The user decides the depth — a section may describe intent in plain
#   language, or specify exact file names, types, props, and code.
#   The agent matches implementation precision to the level of detail provided:
#     - Vague/conceptual  -> infer from best practices and context
#     - Precise/concrete  -> implement exactly as specified
#     - Mixed             -> exact where specified, infer where not
#   This principle applies universally to every section in the spec.
#
# LIST FLEXIBILITY
#   Lists anywhere in a spec may be expressed in any of three styles.
#   Styles may be mixed freely within the same section:
#     (1) Inline comma-delimited:  languages: TypeScript, Python
#     (2) Markdown bullet list:    - TypeScript\n- Python
#     (3) Subsections:             ### TypeScript\n  description...
#
# TAG SYNTAX
#   `[tagname]` bracket notation is a universal convention, usable in any
#   section that defines its own tag vocabulary -- not exclusive to any
#   one section. Each section defines its own enum and meaning:
#     Requirements  -> priority:  [critical] [high] [normal] [low]
#     Issues        -> status:    [open] [fixed] [deferred] [wont-fix]
#   Placement (start of line, end of heading, or inline before a comma-
#   delimited run) and default-when-omitted behavior are defined per section.
#   A tag vocabulary from one section does not apply in another. Sections
#   without a defined vocabulary carry no tags.
#
# CONTENTS PATTERN
#   Default (ungrouped): a section's main entries may be listed directly
#   under its H2 heading -- flat bullets or paragraphs, no wrapper
#   subsection required. This is the common case and stays minimal.
#   Subdividing: if entries grow enough to need named subcategories, they
#   move into a "### Contents | Entries" subsection, then use custom H4
#   headings inside it, one per group. Main content is never subdivided
#   directly under the H2 -- subdividing always means moving into Contents
#   first. This keeps "flat under H2" and "grouped under H4" unambiguous
#   at a glance, with nothing subdivided in between.
#   "Entries" is always a valid generic alias alongside "Contents."
#   Sections may additionally alias Contents to a section-specific name
#   (e.g. User Stories -> ### Stories). The underlying pattern is identical
#   everywhere; only the label changes.
#   This is distinct from a section's other structural subsections (e.g.
#   User Flow, Personas, Assumptions) -- those hold different content
#   entirely, not a subdivision of the main entries, and are never
#   nested inside Contents.
#   Sections that support this pattern say so explicitly; it is not implied
#   for sections that don't mention it.
#
# CUSTOM SUBSECTIONS
#   Any section may contain custom subsections beyond those prescribed here.
#   Custom subsections are valid as long as they do not shadow a prescribed
#   subsection name or alias. The LLM warns on naming conflicts in Plan phase.
#
# SECTION ORDER
#   Sections are peers — all H2, none nested under another.
#   The recommended order below is a convention, not a rule.
#   The LLM reads the full spec regardless of section order.
#
# INLINE HUMAN NOTES
#   HTML comments <!-- ... --> are for humans only.
#   The LLM MUST ignore all HTML comment blocks in all phases.
#
# PRIORITY HIERARCHY
#   When Requirements, Features, and User Stories all exist:
#     Requirements  -> authoritative (testable, drives execution plan)
#     Features      -> supplementary (intent and scope signal)
#     User Stories  -> supplementary (UX detail, acceptance context)
#   Content in Features or User Stories not covered by Requirements is
#   included but flagged in the execution plan as "not formally required."
#
# EXISTING vs NEW INFRASTRUCTURE
#   ## UI may describe an existing UI to consume OR a new one to build.
#   The LLM infers from context. When ambiguous, flag in Plan phase and ask
#   before generating. (## API and Functionality/Database don't carry this
#   ambiguity -- API is scoped to what this component owns and exposes;
#   anything consumed belongs in ## External Interfaces instead.)
#
# DEFERS TO AGENT INSTRUCTIONS
#   SPEC.md defines what and why. How to work -- coding conventions,
#   principles, house style -- is never restated here. Defer entirely to
#   AGENTS.md, CLAUDE.md, or whatever core instruction file the assistant
#   or framework already uses.
#
# SECRETS POLICY
#   The LLM must NEVER generate, suggest, or infer actual secret values
#   (passwords, tokens, API keys, connection strings, certificates) anywhere
#   in the spec or in generated code. Placeholders only:
#     DATABASE_URL=<see vault>
#     API_KEY=<set in CI/CD environment>
#   If actual secrets are detected in the spec, warn the user immediately.
#
# EXTENSION SCHEMAS
#   The base schema covers universal sections applicable to any software system.
#   App-type-specific sections and subsections are defined in extension schemas.
#   Extensions may define new top-level sections, add prescribed subsections to
#   existing sections, or override existing section descriptions and LLM notes.
#   The spec frontmatter declares which extensions apply via `extends-schema`.
#   Examples:
#     schema-functions.yaml    Azure Functions / AWS Lambda
#     schema-database.yaml     Standalone database specs (schema, stored
#                              procs, indexes, seeds, triggers, views)
#     schema-terraform.yaml    Terraform modules
#     schema-library.yaml      Class / component libraries
#     schema-cli.yaml          CLI tools
#     schema-messaging.yaml    Message-driven / event-driven systems
#     schema-notebook.yaml     Jupyter / data science notebooks

---

# ==============================================================================
# FRONTMATTER
# YAML block between triple-dash fences at the top of the SPEC.md file.
# All fields are optional.
# ==============================================================================

frontmatter:

  # -- Identity ----------------------------------------------------------------

  id: string?
  # Unique slug used in spec graph links.
  # Derived from H1 title if omitted: lowercase, spaces -> dashes.
  # Examples: "frontend", "auth-service", "payment-api"

  title: string?
  # Canonical title if omitted from H1 heading.

  version: string?
  # Any format: "1", "2.1", "2025-07-18"

  status: '"draft" | "review" | "stable" | "deprecated"'
  # Default: "draft"
  # LLM warns before implementing a spec that is not "stable".

  type: '"web" | "mobile" | "desktop" | "api" | "library" | "cli" | "service" | "system" | string'
  # Accepts any string for extensibility.

  schema: '"specmd" | "adhoc" | string?'
  # Default: "specmd" (implied when omitted -- validates against this schema).
  # "adhoc": freeform spec, no schema conformance expected or enforced.
  #          The agent reads content as-is -- no heading/structure validation,
  #          no warnings about unrecognized sections.
  # string:  Name or path to a custom/forked schema file (e.g. "my-schema.yaml").
  #          Same loading mechanism as extends-schema, but replaces the base
  #          schema entirely rather than adding to it.

  extends-schema: '[string]?'
  # Extension schema files that add or override sections for this spec.
  # Examples:
  #   extends-schema: schema-functions.yaml
  #   extends-schema:
  #     - schema-functions.yaml
  #     - schema-messaging.yaml

  # -- Tech Stack --------------------------------------------------------------
  # Machine-readable technical metadata.
  # Replaces a ## Specifications / ## Specs body section.
  # All fields accept inline comma-delimited string or YAML list.
  # Treated as a starting point, not the final word -- ## Requirements /
  # ### Technical is authoritative if the two contradict. Conflicts are
  # surfaced in the Plan phase, never silently resolved.

  tech:

    languages: '[string] | string?'
    # languages: TypeScript, Python
    # languages: [TypeScript, Python]

    frameworks: '[string] | string?'
    # frameworks: React v19+, Tailwind CSS
    # frameworks:
    #   - React v19+
    #   - Tailwind CSS

    platform: string?
    # Target runtime or platform.
    # Examples: browser, iOS, Android, Node.js, AWS Lambda

    dependencies: '[string | DependencyObject]?'
    # Additional packages not listed under frameworks.
    # Accepts strings, DependencyObjects, or a mixed list.
    # dependencies: Axios, React Query v5+
    # dependencies:
    #   - Axios
    #   - name: React Query
    #     version: "^5.0.0"
    #     reason: Server state management

  # -- Spec Graph Links --------------------------------------------------------
  # Relationships between specs. Builds a navigable spec graph.
  # Each field accepts: string | [string] | [LinkObject] | mixed list.
  # Paths may be relative, absolute, or URLs (for cross-repo references).

  links:

    depends-on: '[string | LinkObject]?'
    # Specs that MUST be implemented before this one. Hard dependency.
    # LLM warns if a linked spec has status "draft".
    # depends-on: ../auth/SPEC.md
    # depends-on:
    #   - ../auth/SPEC.md
    #   - spec: https://github.com/org/repo/api/SPEC.md
    #     reason: Shared API contract

    extends: '[string | LinkObject]?'
    # Specs this spec inherits from or specializes.
    # extends: ../base/base-service.spec.md

    related: '[string | LinkObject]?'
    # Informational links. No dependency semantics.
    # related:
    #   - ../design-system/tokens.spec.md
    #   - spec: ../ops/deployment.spec.md
    #     reason: Shares deployment pipeline

  # -- Instructions ------------------------------------------------------------
  # Instructions for the agent to follow when editing the spec.
  # This may include compacting rules and restrictions.

  instructions: string?
  # Example:
  # When compacting, keep the last 10 items in Issues, remove the rest.

  # -- Metadata ----------------------------------------------------------------

  metadata: object?
  # Arbitrary key-value mapping, following the SKILL.md convention.
  # No fixed schema -- any keys are valid. Common keys: author, created,
  # updated (yyyy-mm-dd), owner, tags.
  # Write-restricted by default: the agent reads these values but does not
  # add, edit, remove, or clean up keys unless explicitly instructed to in
  # the current request. Standing permission (e.g. "always keep `updated`
  # current") may be granted via the `instructions` field below.
  # Example:
  #   metadata:
  #     author: Joe Agster
  #     created: 2025-07-01
  #     updated: 2025-07-18
  #     owner: platform-team

  # -- Changelog ---------------------------------------------------------------
  # Human-readable version history. A convenience only -- git commit history
  # on the spec file is the actual source of truth for change tracking.
  # Kept as its own top-level field (not nested under metadata) since it's a
  # list of dated entries, not a flat property -- frontmatter nesting is kept
  # to one level throughout.
  # Agents may only append a new item if explicitly requested to do so.

  changelog: '[string]?'
  # Format: "[yyyy-mm-dd] description"
  # - "[2026-07-01] Initial draft"
  # - "[2026-07-18] Added user stories"


# ==============================================================================
# BODY
# Standard markdown following the frontmatter block.
# ==============================================================================

body:

  # -- Title & Description -----------------------------------------------------

  title:
    format: "# Title  (H1, first line after frontmatter)"
    required: true
    note: Canonical spec title. Used as ID source if frontmatter id is omitted.

  description:
    format: "Markdown paragraphs immediately below H1 (optional)"
    note: >
      One sentence to a few paragraphs on purpose and intent.
      What the system does, not how. Sufficient for the LLM to understand
      the system before reading any section.

  # -- Path References ---------------------------------------------------------
  # File and directory paths use backtick formatting throughout the spec:
  #   `src/components/CustomerTable.tsx`
  # The LLM treats these as concrete assertions resolved against Folder Structure.
  # Square brackets denote placeholder patterns: `[ComponentName]/index.ts`

  # -- Sections ----------------------------------------------------------------
  # All sections are optional H2 headings. Order is not enforced.
  # Recommended order is listed below as a convention.
  # Aliases listed for each section are treated as fully equivalent by the LLM.

  sections:

    # ==========================================================================
    # PRODUCT SECTIONS
    # ==========================================================================

    # --------------------------------------------------------------------------
    features:
      heading: "## Features"
      aliases: []
      category: product
      description: >
        High-level capabilities of the system. Human-readable and scannable.
        What the system does, not constraints or quality attributes.
        Intentionally overlaps with User Stories -- users provide either or
        both depending on their working culture.
      subsections: custom only
      llm_note: >
        Supplementary to Requirements. Requirements are authoritative.
        Features provide intent and scope signals.

    # --------------------------------------------------------------------------
    requirements:
      heading: "## Requirements"
      aliases: []
      category: product
      description: >
        Universal, testable constraints for the system: functional,
        non-functional, technical, performance, security, and compliance.
        Authoritative -- drives the execution plan above all other sections.

      priority_tags:
        note: >
          Annotate individual items (start of line), section/subsection
          headings (end), or inline comma-delimited runs. In inline form,
          a tag applies to all items until the next tag appears in the list.
          Omitted tag implies [normal].
        tags:
          "[critical]": Must implement. Blocking. Unacceptable to omit.
          "[high]":     Important. Should implement. Not blocking.
          "[normal]":   Standard. Default when tag is omitted.
          "[low]":      Nice to have. Implement if time permits.
        examples: |
          - [critical] Users must be authenticated before accessing any data.
          - [high] API response time must be under 200ms at p95.
          - The UI must be responsive on desktop and mobile.
          - [low] Support dark mode.

          ### Non-Functional
          #### Performance [critical]
          - Pages must load within 2 seconds on a 4G connection.

          [high] Support CSV export, support bulk delete, [low] add dark mode
          <- inline form: [high] applies to the first two items, [low] to the third

      subsections:
        functional:
          heading: "### Functional"
          description: What the system must do.

        non-functional:
          heading: "### Non-Functional"
          aliases: []
          description: >
            Quality attributes: how the system must behave, not what it must
            do. Performance, reliability, availability, scalability,
            usability, security-as-a-quality, compliance. Testable as a
            spectrum (e.g. "under 200ms at p95"), not a binary mandate.
            Custom subsections encouraged here (e.g. #### Performance,
            #### Security, #### Compliance). Note: avoid placing custom
            subsections directly under ## Requirements -- nest them under
            ### Non-Functional or ### Technical instead.
            Distinct from ### Technical: Non-Functional is measurable
            quality, Technical is binary mandate.

        technical:
          heading: "### Technical"
          description: >
            Imposed constraints and mandates -- binary conformance, not a
            measurable spectrum like Non-Functional. Use for integration
            requirements, deployment/environment constraints, and
            organizational policy mandates -- not stack choices, which
            belong in frontmatter `tech:` (that's a starting point;
            this subsection is the final authority if they contradict --
            surface the conflict in Plan phase rather than silently
            resolving it).
          example: |
            - Must integrate with the legacy SOAP-based inventory system.
            - Must deploy to the existing on-prem Kubernetes cluster.
            - Must authenticate via the company's Okta SSO tenant.

        out-of-scope:
          heading: "### Out of Scope"
          description: >
            Hard boundary. The LLM must never implement anything listed here,
            even if implied elsewhere in the spec.

        future:
          heading: "### Future | Future Considerations"
          description: >
            Planned for later versions. Not implemented now.
            The LLM uses these to lay groundwork where doing so satisfies
            an active requirement without adding significant complexity.

    # --------------------------------------------------------------------------
    considerations:
      heading: "## Considerations"
      aliases: []
      category: product
      description: >
        Contextual signals that inform the system without mandating it.
        Not testable requirements -- those belong in ## Requirements. Not
        structural design. Use for: deployment context, user population,
        organizational constraints, regulatory environment, known risks,
        team conventions, or anything the LLM should keep in mind while
        planning and implementing. Includes legacy context: facts about a
        prior system or requirement that no longer apply directly but still
        shape design decisions today (e.g. a retired integration whose
        downstream consumers haven't caught up yet).
        Main entries go directly under this H2 (flat bullets or paragraphs,
        no wrapper subsection). Use ### Contents | Entries only if entries
        grow enough to need named subgroups (see Contents Pattern).

      subsections:
        assumptions:
          heading: "### Assumptions"
          description: >
            Things taken as true for planning purposes. If false, requirements
            elsewhere in the spec may need to change. Distinct from main
            Considerations entries: an assumption is a premise the spec
            depends on, not just background context.
          example: |
            - We are never going back to the v1.2 wizard-based interface.

        dependencies:
          heading: "### Dependencies"
          description: >
            External factors this spec relies on that are outside the
            team's direct control -- another team's deliverable, a
            third-party service's availability, a platform migration
            completing on schedule.
          example: |
            - Depends on the platform team's Q3 auth migration completing
              before SSO can be enabled.

      example: |
        - We dropped legacy feature X 2 years ago after the acquisition.
        - We may bring back support for Y feature.

        ### Assumptions
        - We are never going back to the v1.2 wizard-based interface.

    # --------------------------------------------------------------------------
    user-stories:
      heading: "## User Stories"
      aliases: ["## Stories"]
      category: product
      description: >
        How users interact with the system. Intentionally overlaps with Features.
        Format: "As a [user], I want to [action] so that [benefit]."
        Users may be human actors or external systems.
        Main entries go directly under this H2 (flat, no wrapper subsection)
        by default. Use ### Contents | Entries (aliased here to ### Stories)
        only once flat entries need named subgroups (see Contents Pattern).
      llm_note: >
        Supplementary to Requirements. Provides UX detail and acceptance signals.

      subsections:
        personas:
          heading: "### Personas | Actors"
          description: >
            Short definitions of the actor types referenced in stories --
            name, role, one line of context. Optional. Lets stories reference
            an actor (e.g. "As an [Admin]...") without re-explaining who that
            is each time.
          example: |
            - **Admin**: manages catalog and orders.
            - **Guest**: browses without an account.

        stories:
          heading: "### Stories | Contents | Entries"
          description: >
            The Contents Pattern (see schema header) applied to this section.
            Only used once stories need named subgroups -- otherwise stories
            live directly under ## User Stories (see section description).
            Custom H4 headings inside, one per theme/epic/feature area,
            each holding its own entries.
          acceptance_criteria_pairing: >
            Acceptance criteria may nest directly under a story as indented
            checkbox sub-bullets (JIRA-style pairing) -- the recommended
            form when criteria are specific to one story. Criteria that
            apply globally across all stories instead belong in the
            sibling ### Acceptance Criteria subsection below.
          example: |
            #### Search Page
            - As a [Guest], I want to search products so I can find what I need.
              - [ ] Search returns results within 2s
              - [ ] Empty search shows a "no results" message

            #### User Profile Page
            - As an [Admin], I want to edit a user's role so I can manage access.
              - [ ] Role change is audit-logged

        user-flow:
          heading: "### User Flow | Flow"
          description: >
            Primary user journey. Accepts numbered steps, narrative paragraphs,
            or inline Mermaid diagrams.

        acceptance-criteria:
          heading: "### Acceptance Criteria | Acceptance"
          description: >
            Testable completion conditions that apply globally across all
            stories, not to one specific story. Format: - [ ] checkbox.
            For criteria specific to a single story, nest them under that
            story in ### Stories instead (see acceptance_criteria_pairing).
            [critical] and [high] requirements without explicit criteria
            still imply mandatory test coverage.
          example: |
            - [ ] All destructive actions require confirmation.

    # ==========================================================================
    # DESIGN SECTIONS
    # ==========================================================================

    # --------------------------------------------------------------------------
    architecture:
      heading: "## Architecture"
      aliases:
        - "## Application"
        - "## System Design"
        - "## Application Design"
        - "## Design"
      category: design
      description: >
        Structural design of the system at any level of abstraction.
        Covers patterns, frameworks (TOGAF, Arc42, C4, ADRs), UML artifacts,
        and component relationships.
        Scale-agnostic: enterprise specs use this for system-wide diagrams;
        application specs use it for application-specific structure.
        Diagrams supported: inline Mermaid (```mermaid), image links, ASCII art.
      subsections: custom only
      llm_note: >
        Architecture informs implementation decisions at every section.
        When a section lacks detail, derive from Architecture and best practices.

    # --------------------------------------------------------------------------
    domain:
      heading: "## Domain"
      aliases:
        - "## Data"
        - "## Data Model"
        - "## Data Design"
        - "## Domain Model"
      category: design
      description: >
        Logical domain model: entities, relationships, and shared types.
        Language and framework agnostic -- conceptual model, not storage schema.
        A spec may have no database in scope; the domain model stands independently.
        Mermaid ER and UML class diagrams supported inline.
      llm_note: >
        Domain is the logical model, independent of physical storage.
        Connection-level storage detail belongs to ## External Interfaces;
        full storage design (schema, stored procedures, etc.) belongs to
        the database owner's own spec or the schema-database extension.
        Never collapse Domain into any of these -- it stands on its own
        even when a spec has no database in scope at all.

      subsections:
        entities:
          heading: "### Entities"
          description: >
            Core domain objects. Each entity as an H4 subsection with a field list.
            Field format: - fieldName: type (constraint note)
            Depth is flexible per the spectrum principle -- from named entities
            only, to fully typed fields with constraints and relationships.
          field_types: "string, int, float, bool, datetime, uuid, [Type], Type?"
          constraints: >
            (required), (max 254 chars), (ref: Order.id),
            (range: 0-100), (regex: ^[A-Z]{2}[0-9]{4}$)
          example: |
            #### Customer
            - id: uuid
            - name: string (required)
            - email: Email              <- references a Type
            - status: CustomerStatus    <- references a Type (enum)
            - orders: [Order]           <- relationship implied by list type

        relationships:
          heading: "### Relationships"
          description: >
            Centralizes relationship definitions, especially when complex or
            fluid. May supplement implied relationships within entity definitions.
          example: |
            - Customer has many Orders (one-to-many)
            - Order has many Products (many-to-many via OrderLine)
            - Order belongs to one Customer

        types:
          heading: "### Types"
          description: >
            Shared constrained types across the domain. Not storage-backed entities.
            Fully open-ended -- enums, ranges, regex patterns, structs, and more.
            The LLM maps each definition to the appropriate language construct
            (TypeScript union, Zod schema, Python Literal, enum, dataclass, etc.)
          forms:
            enum:             '"active" | "inactive" | "pending"'
            range:            "Int(0-100), Float(0.0-1.0)"
            format:           "string (must contain @, max 254 chars)"
            regex:            "string (regex: ^[A-Z]{2}[0-9]{4}$)"
            struct:           "Point:\n  x: Float\n  y: Float"
            domain_ref:       "[Domain: EntityName]"
          example: |
            - CustomerStatus: "active" | "inactive" | "pending"
            - Score: Int(0-100)
            - Email: string (must contain '@', max 254 chars)
            - Percentage: Float(0.0-1.0)
            - Point:
                x: Float
                y: Float

    # --------------------------------------------------------------------------
    external-interfaces:
      heading: "## External Interfaces"
      aliases: ["## External Dependencies", "## Interfaces"]
      category: design
      description: >
        Systems, services, and interfaces this component depends on but does
        not own or control -- borrowed from the SRD convention of the same
        name (there, split into Hardware/Software/Communications Interfaces;
        User Interfaces is covered separately by ## UI in this schema).
        Covers: third-party APIs and services (Stripe, Twilio, SendGrid,
        OAuth providers), a backend API a frontend consumes, hardware
        interfaces (sensors, printers, kiosk peripherals, IoT devices),
        databases this component connects to (connection-level detail only
        -- schema, stored procedures, and other storage-design detail
        belong to ## Functionality/Database, the database owner's own spec,
        or the schema-database extension for standalone database specs),
        and communications interfaces (email/SMS gateways, inbound webhooks
        from outside).
        Placed before ## UI: these dependencies may indirectly drive UI
        design (a third-party payment widget, a hardware constraint) even
        though the relationship isn't always direct.
      llm_note: >
        When a dependency already has its own linked spec (frontmatter
        `links`), this section may still restate the contract here for
        convenience -- doing so is allowed, not required. On conflict
        between the restated contract and the linked spec, the linked
        spec is authoritative; flag the discrepancy in Plan phase.
      subsections: custom only
      example: |
        ### Orders API (backend)
        REST. Base URL: /api/v1/orders. See ../orders-service/SPEC.md for
        the full contract; consumed endpoints: GET /orders, POST /orders.

        ### Stripe
        Payment processing. Webhook: /webhooks/stripe (payment_intent.succeeded).

        ### Receipt Printer
        ESC/POS thermal printer via USB. See vendor SDK docs for command set.

    # --------------------------------------------------------------------------
    ui:
      heading: "## UI"
      aliases:
        - "## Frontend"
        - "## UX"
      category: design
      description: >
        User interface design, for any UI paradigm -- web, mobile, desktop,
        embedded/widget, kiosk, voice/IVR, AR/VR, CLI/TUI, or anything else.
        May range from conceptual (intent, layout, named units) to concrete
        (exact component names, props, file paths, framework specifics) --
        the spectrum principle applies per subsection, so e.g. Components
        may be described purely logically or as physical framework-specific
        artifacts (a React component tree), whichever fits.
        May describe an existing UI to consume or a new UI to build.
        Diagrams, wireframes, image links, and Mermaid flows supported.
        No Contents Pattern here -- UI has several parallel subsections
        rather than one dominant content stream, so there's nothing for a
        Contents wrapper to disambiguate. Entries may be listed directly
        under ## UI itself with no subsections at all (flat bullets or a
        description), as long as no subsections are also present -- this
        applies to any section, not just UI.

      subsections:
        layout:       "### Layout       - Overall structure, regions, grid, header/footer/sidebar."

        pages:        "### Pages        - Logical or physical pages. Web applications."
        screens:      "### Screens      - Logical or physical screens. Mobile applications."
        windows:      "### Windows      - Top-level windows or frames. Desktop applications."
        views:        "### Views        - View definitions. MVC/MVVM and cross-platform contexts."
        # Pages/Screens/Windows/Views are independent, not aliases of one
        # another -- a hybrid or multi-target spec may use more than one
        # simultaneously (e.g. a web/desktop hybrid app using both Pages
        # and Windows). The LLM infers which physical construct applies to
        # which build target rather than the spec being forced to pick one.

        components:
          heading: "### Components"
          description: >
            UI components, logical or physical (per spectrum principle --
            both are valid, including a fully framework-concrete component
            tree). May be grouped under custom H4 headings if the list
            grows large enough to need it -- no wrapper subsection required.
            An optional ### Implementation heading may nest under an
            individual component for framework-specific code details kept
            separate from a more conceptual description, but this is
            discouraged -- inline detail within the component entry is
            preferred in the common case.

        widgets:      "### Widgets      - Self-contained UI units. Flutter, Android, desktop."
        viewgroups:   "### ViewGroups   - Container/layout groupings. Android and hierarchical UI."
        # Independent of Components and of each other for the same reason
        # as Pages/Screens/Windows/Views -- coexist freely when the design
        # calls for the distinction (e.g. Android specs using ViewGroups
        # alongside general Components).

        navigation:   "### Navigation   - Routing, nav patterns, transitions, deep links, tab bars."
        events:       "### Events | Interactions  - User gestures, drag, keyboard, touch events."
        animations:   "### Animations   - Motion design, transitions, micro-interactions."
        localization: "### Localization - Multi-language, RTL/LTR, locale formatting, translation."
        accessibility:
          heading: "### Accessibility"
          description: >
            WCAG level, ARIA roles, screen reader behavior, keyboard nav, contrast.
            May also appear under Requirements/Non-Functional.
            LLM merges both if defined in both places.
        styles:       "### Styles | Theme  - Colors, typography, spacing, design tokens."
        assets:       "### Assets       - Images, icons, fonts, external resources."

    # --------------------------------------------------------------------------
    api:
      heading: "## API"
      aliases: ["## Backend"]
      category: design
      description: >
        API design for this component's own exposed API surface -- what it
        builds and owns. Protocol-agnostic: REST, GraphQL, WebSocket, gRPC,
        SOAP, WCF, MCP, or any other, present or future. A system may mix
        protocols freely.
        May range from endpoint names only to full request/response schemas.
        Organized by protocol OR by named API -- both valid, may be mixed.
        Omit this section entirely if the component has no API of its own
        (e.g. a pure frontend). For an API this component consumes but
        doesn't own, use ## External Interfaces instead.

      organizing_patterns:
        by_protocol: |
          ## API
          ### REST
          ### GraphQL
          ### WebSocket
          ### MCP
        by_named_api: |
          ## API
          ### Orders API
          REST-based. Base URL: /api/v1/orders
          ### Notifications API
          WebSocket-based.
        multi_binding: |
          ## API
          ### Orders Service
          Bindings: SOAP (basicHttpBinding), REST (webHttpBinding), TCP (netTcpBinding)
          ### Endpoints
          - **GetOrder(id): Order** -- all bindings
          - **ExportOrders(): Stream** -- SOAP, TCP only
        note: >
          Named APIs may declare their protocol and use protocol-appropriate
          subsections. Any protocol -- old, current, or not yet invented --
          uses this same pattern as a custom H3, no schema change required
          (e.g. ### gRPC, ### MQTT, ### AMQP, ### MCP).
          For a monolith/enterprise service layer exposing one shared
          contract over multiple transport bindings at once (classically
          WCF, but any multi-binding backend qualifies), use multi_binding
          instead of by_protocol -- declare Bindings once at the named-API
          level and define operations a single time; annotate an individual
          endpoint only when its binding availability differs from the
          declared default. This avoids duplicating the same operations
          under separate protocol subsections when the underlying contract
          is genuinely one contract, not several.

      inheritable_subsections:
        note: >
          Defined at ## API level as global default, overridden within individual
          protocol or named API blocks. LLM applies most specific definition.
        authentication:  "### Authentication | Auth | Security"
        versioning:      "### Versioning"
        rate-limiting:   "### Rate Limiting"

      per_api_subsections:
        endpoints:
          heading: "### Endpoints | Paths | Operations | Channels | Methods | Tools"
          description: >
            The callable/interactive surface, whatever a given protocol
            calls it -- this list is illustrative, not exhaustive.
            Endpoints/Paths (REST), Operations (GraphQL), Channels
            (WebSocket), Methods (gRPC/SOAP/WCF), Tools/Resources/Prompts
            (MCP). A protocol not listed here uses its own native term
            directly -- no schema change required, same principle as
            organizing_patterns above. May use custom subsections for
            grouping.
          examples:
            rest: |
              - **GET /api/customers**: Paginated customer list.
              - **POST /api/customers**: Create customer.
            graphql: |
              - `query GetCustomer(id: ID!)`: Single customer.
              - `mutation CreateCustomer(...)`: Create.
              - `subscription OnCustomerUpdated`: Real-time stream.
            websocket: |
              - `/ws/notifications`: Server-push stream.
              - `/ws/chat/:roomId`: Bidirectional chat.
            mcp: |
              - **Tool** `search_customers(query: string)`: Returns matching customers.
              - **Resource** `customer://{id}`: Single customer record.

        schema:
          heading: "### Schema | DTOs | Types | Models"
          description: >
            Wire shapes for requests, responses, and messages.
            Distinct from Domain types -- these are API-layer contracts.
            May reference domain models rather than redefining them:
              customer: [Domain: Customer]
            Wrapping patterns (HATEOAS, envelopes, pagination) defined here.
          example: |
            #### CustomerResponse
            - customer: [Domain: Customer]
            - links:
                self: string (URL)
                orders: string (URL)

        errors:
          heading: "### Errors | Error Handling"
          description: Error codes, shapes, and behavior.

    # --------------------------------------------------------------------------
    functionality:
      heading: "## Functionality"
      aliases:
        - "## Functional Design"
        - "## Functional"
        - "## Other Functionality"
      category: design
      description: >
        Catch-all design section for functional behavior not covered by UI,
        API, or External Interfaces. Use for niche app types, cross-cutting
        concerns, or any system behavior that doesn't fit cleanly elsewhere.
        Flat by nature: prescribed and custom H3 subsections sit as peers,
        each independent. No Contents/Entries pattern applies here -- content
        under any subsection subdivides however the user wants (H4+, freely),
        since there's no single "main content" stream to disambiguate from
        a grouped one the way User Stories or Considerations have.
        Follows the spectrum principle: entries may be conceptual descriptions
        or concrete specifications with schemas, handlers, and behavior details.
        Subsections below are the commonly-needed ones kept in the base
        schema; anything else is a custom H3, added freely. If the same
        custom subsection appears repeatedly across multiple specs, consider
        formalizing it as an extension schema instead.

      subsections:
        events:
          heading: "### Events | Event Handlers"
          description: >
            Reactive event handlers, pub/sub subscribers, inbound webhooks,
            and any logic triggered by external or internal events.

        triggers:
          heading: "### Triggers"
          description: >
            Non-HTTP entry points: timer/cron, blob storage, queue arrival,
            database change feed (CDC), cloud events. Common in serverless
            and function app contexts. Distinct from Functions/Lambdas below:
            Triggers describes what invokes a function, Functions/Lambdas
            describes the function itself.

        jobs:
          heading: "### Jobs | Scheduled Tasks | Batch"
          description: >
            Recurring or one-off batch processes, background tasks, and
            scheduled workloads. Distinct from Triggers in that jobs are
            typically process-oriented rather than event-reactive.

        messaging:
          heading: "### Messaging"
          description: >
            Message producers, consumers, topic/queue contracts, message schemas,
            retry policies, and dead-letter handling.

        functions:
          heading: "### Functions | Lambdas"
          description: >
            Serverless function handlers: name, purpose, runtime, handler
            signature. May range from function names only to full signatures
            and bindings. See the schema-functions extension for a fuller
            trigger-type taxonomy (HTTP, Timer, Blob, Queue, Event, Database,
            Custom) nested under this subsection.

        workers:
          heading: "### Workers | Background Workers"
          description: >
            Long-running background processes, daemon tasks, and
            worker queue consumers that operate outside the request cycle.

        database:
          heading: "### Database"
          description: >
            Standalone database design owned by this component -- schema,
            stored procedures, triggers, indexes, seeds, and similar
            artifacts. Kept intentionally short and open-ended here; the
            schema-database extension defines a fuller taxonomy for these
            artifacts when a spec needs to go deeper.
            For a database this component merely connects to but doesn't
            own, use ## External Interfaces instead.

    # --------------------------------------------------------------------------
    testing:
      heading: "## Testing"
      aliases: ["## Tests"]
      category: design
      description: >
        Testing strategy. Describes how to test, not what -- the LLM infers
        what to test from Requirements, priority tags, and Acceptance Criteria.
        May range from framework declarations only to detailed test scenarios.
        Frameworks, coverage rules, test data, and fixtures are custom subsections
        within whichever testing domain they belong to.
      llm_note: >
        [critical] and [high] requirements imply mandatory coverage even when
        this section is silent.
        Never generate Integration or E2E tests unless explicitly prescribed here.

      subsections:
        unit:           "### Unit | Unit Tests           - Component/function level, isolation."
        integration:    "### Integration | Integration Tests - Service boundaries, component interaction."
        e2e:            "### E2E | End-to-End            - Full user flow testing."
        performance:    "### Performance | Load | Benchmark"
        security:       "### Security | Penetration | OWASP"
        accessibility:
          heading: "### Accessibility | a11y"
          description: >
            Accessibility test scenarios and tooling (axe, Lighthouse, etc.).
            May also appear under ## UI/Accessibility or
            Requirements/Non-Functional. LLM merges all three if defined
            in more than one place.

      example: |
        ### Unit
        Use `vitest` v3. 80% coverage minimum.

        #### Coverage
        - Exclude `src/mocks/` from reporting.
        - `CustomerService.ts` requires 100%.

        #### Frameworks
        Vitest v3, React Testing Library v16.

    # ==========================================================================
    # INFRASTRUCTURE SECTIONS
    # ==========================================================================

    # --------------------------------------------------------------------------
    folder-structure:
      heading: "## Folder Structure"
      aliases:
        - "## Project Structure"
        - "## Project"
        - "## Structure"
      category: infrastructure
      description: >
        Source of truth for project organization. May be as sparse or as
        detailed as needed -- partial structures are valid. The LLM fills gaps
        using framework conventions.
        All backtick path references elsewhere in the spec resolve here.
        Local folder trees in other sections are not forbidden but this wins
        on conflict.
      conventions:
        placeholders: "Square brackets for dynamic segments: [ComponentName]/, [feature].ts"
        path_refs:    "Backtick paths throughout spec: `src/components/Header.tsx`"
        format:       "Tree view (preferred) or nested list."
      example: |
        src/
        +-- components/
        |   +-- [ComponentName]/
        |       +-- index.ts
        |       +-- [ComponentName].tsx
        |       +-- [ComponentName].test.tsx
        +-- hooks/
        +-- services/
        +-- main.tsx

    # --------------------------------------------------------------------------
    setup:
      heading: "## Setup"
      aliases:
        - "## Getting Started"
        - "## Installation"
      category: infrastructure
      description: >
        Project scaffolding and initialization. Executed only on initial
        generation or when setup-related changes are detected.
        If the project exists with no setup changes, skip.
        If existing dependencies conflict with the spec, warn and ask.
      idempotency: >
        Setup steps MUST be idempotent (safely re-runnable).
        The LLM annotates any non-idempotent step visibly:
          Non-idempotent: run once only.
        Examples: database seed, one-time token generation, destructive reset.
        Prefer idempotent alternatives wherever possible.
      os_note: >
        Detect or ask about OS/shell (PowerShell, bash, zsh) and generate
        compatible commands.

      subsections:
        prerequisites:
          heading: "### Prerequisites"
          description: What must exist before setup runs. Listed before install steps.
          example: |
            - Node.js v20+
            - Docker Desktop
            - `.env` copied from `.env.example`

        validation:
          heading: "### Validation"
          description: Command to run and expected result confirming setup succeeded.
          example: |
            Run `npm run dev` -- confirm app loads at `http://localhost:5173`
            without console errors.

    # --------------------------------------------------------------------------
    deployment:
      heading: "## Deployment"
      aliases: ["## Deploy", "## DevOps"]
      category: infrastructure
      description: >
        Deployment targets, environments, tooling, and operational concerns.
        May describe an existing pipeline to integrate with or a new one to create.
        Flag ambiguity in Plan phase.
      secrets_note: See Secrets Policy in schema header.

      subsections:
        environments:    "### Environments  - dev, staging, production, DR, feature branch, etc."
        cicd:            "### CI/CD | Pipeline  - GitHub Actions, Azure DevOps, Jenkins, etc."
        infrastructure:  "### Infrastructure | IaC  - Terraform, Bicep, Pulumi, Helm, Docker Compose."
        targets:         "### Targets | Hosting  - AWS, Azure, GCP, Vercel, on-premises, etc."
        scalability:
          heading: "### Scalability"
          description: >
            Auto-scaling, load balancing, CDN, caching layers -- the
            operational mechanism. May also appear under
            Requirements/Non-Functional as the target being scaled to.
            LLM merges both if defined in both places.
        rollback:        "### Rollback  - Strategy, triggers, recovery procedures."
        monitoring:      "### Monitoring | Observability  - Logging, metrics, alerting, tracing."
        secrets:
          heading: "### Secrets | Configuration | Environment Variables"
          description: >
            Secrets management strategy and variable structure.
            Variable names and descriptions only -- never actual values.
            Reference the secrets store (vault, CI/CD env, key management service).

    # ==========================================================================
    # TRACKING SECTIONS
    # ==========================================================================

    # --------------------------------------------------------------------------
    issues:
      heading: "## Issues"
      aliases: ["## Known Issues", "## Bugs"]
      category: tracking
      description: >
        Exists because implementation sometimes gets something wrong when
        the spec itself had a gap -- an ambiguity, an unstated assumption,
        a missing case. When that happens there are two remediation paths:
        fix the gap directly in the relevant section (preferred -- the spec
        is the truth document, so the gap shouldn't persist once found), or
        record it here when the fix isn't yet decided, or when leaving a
        durable note has value beyond the immediate fix.
        Not a bug tracker or a status-tracking system -- ongoing triage,
        assignment, and remediation workflow belong in a separate
        issue-tracking system if the team uses one. This section stays lean:
        as issues are resolved they're either removed outright, or moved to
        a Fixed subsection whose purpose is specifically preventing the same
        mistake from being reintroduced later, not maintaining a history log.

      status_tags:
        "[open]":     "Active, unresolved. Default when tag omitted. Alias: [active]"
        "[fixed]":    "Resolved. Alias: [resolved]"
        "[deferred]": "Acknowledged, not currently being addressed."
        "[wont-fix]": "Will not be fixed. Alias: [not-a-bug]"

      forms:
        compact: |
          - [open] Modal z-index conflict with toast notifications.
          - [open] Unhandled 401 in `src/hooks/useCustomers.ts`.
          - [deferred] Dark mode -- pending design tokens.
          - [wont-fix] IE11 -- out of scope per requirements.
        subsection: |
          ### Active
          - Modal z-index conflict with toast notifications.
          ### Deferred
          - Dark mode -- pending design tokens.
          ### Not a Bug
          - IE11 -- out of scope per requirements.

      subsections:
        active:   "### Active | Open"
        fixed:    "### Fixed | Resolved"
        deferred: "### Deferred"
        wont-fix: "### Not a Bug | Won't Fix"

      llm_note: >
        No prescribed workflow for triaging, resolving, or cleaning up
        issues -- the user or whoever is directing implementation decides
        what to address and when. Status tags record state; they don't
        trigger automatic action on their own.

    # ==========================================================================
    # REFERENCE SECTIONS
    # ==========================================================================

    # --------------------------------------------------------------------------
    glossary:
      heading: "## Glossary"
      aliases: []
      category: reference
      description: >
        Domain terms, jargon, and acronyms. Primarily human-readable.
        The LLM uses definitions here to resolve ambiguous terminology
        found elsewhere in the spec.
      subsections: custom only

    # --------------------------------------------------------------------------
    references:
      heading: "## References"
      aliases: []
      category: reference
      description: >
        External documentation, related projects, design files, and resources.
        The LLM may fetch external URLs when needed to fulfill spec requirements
        (e.g. reading an API spec, design system docs, or data schema).
        Purely external resources -- for related internal specs, use
        frontmatter `links` (depends-on / extends / related) instead, which
        already carries an optional `reason` note. Keeps one canonical place
        for spec-to-spec relationships rather than two.
      subsections: custom only
      example: |
        - [Tailwind + Vite](https://tailwindcss.com/docs/installation/using-vite)

        ### Design
        - Figma: [Component Library](https://figma.com/...)


# ==============================================================================
# SUPPORTING TYPES
# ==============================================================================

types:

  DependencyObject:
    name: string
    version: string?   # "^5.0.0", "v19+", ">=2.0"
    reason: string?

  LinkObject:
    spec: string       # Relative path, absolute path, or URL to .spec.md
    reason: string?    # Human note on the nature of this relationship


# ==============================================================================
# EXTENSION SCHEMA FORMAT
# ==============================================================================

extension_schema:
  description: >
    Extension schemas follow the same YAML structure as the base schema.
    They may define new sections, add prescribed subsections to existing
    sections, or override descriptions and LLM notes.
    Extension schemas are declared in the spec frontmatter via extends-schema.

  can_do:
    - "Define new top-level sections (e.g. ## Commands)"
    - "Add prescribed subsections to existing sections (e.g. ## API / ### gRPC)"
    - "Override section descriptions or llm_note fields"
    - "Define artifact type taxonomies relevant to the app type"
    - "Add new organizing patterns to existing sections"
    - >
      Promote a base-schema subsection to a full top-level section via
      `precedence`, when a base section's brief/open-ended treatment of a
      topic (e.g. Functionality's ### Functions | Lambdas, or
      ### Database) needs a fuller taxonomy than a subsection can carry.
      The promoted section shadows the base subsection while the extension
      is loaded; the base subsection's content model still applies to any
      spec that doesn't load the extension.

  example_structure: |
    # schema-functions.yaml
    # Extension schema for Azure Functions / AWS Lambda

    extends: schema.yaml

    sections:

      functions:
        heading: "## Functions | Lambdas"
        precedence: "functionality.functions"
        # Shadows Functionality's ### Functions | Lambdas subsection while
        # this extension is loaded -- promoted to a full top-level section
        # (category: design, peer to UI/API/Functionality) with room for
        # the fuller trigger taxonomy below.
        category: design
        description: >
          Serverless function handlers and their trigger configurations.
          May range from function names and trigger types only to full
          handler signatures, bindings, and environment configuration.

        subsections:
          http:
            heading: "### HTTP Trigger | HTTP"
            description: HTTP-triggered functions. See also ## API for endpoint contracts.

          timer:
            heading: "### Timer Trigger | Timer | Scheduled"
            description: >
              Cron-scheduled functions.
              Format: - `FunctionName`: schedule (cron expression), description.
            example: |
              - `DailyReportJob`: 0 2 * * * (daily at 02:00 UTC).
                Generates and emails the daily summary report.

          blob:
            heading: "### Blob Trigger | Blob Storage"
            description: Fires on blob storage create/update events.

          queue:
            heading: "### Queue Trigger | Queue"
            description: Fires on message arrival (Service Bus, Storage Queue, SQS, etc.)

          event:
            heading: "### Event Trigger | Event Grid | Event Hub"
            description: Fires on cloud or custom events.

          database:
            heading: "### Database Trigger | Change Feed | CDC"
            description: Fires on database change events (Cosmos DB, DynamoDB Streams, Debezium).

          custom:
            heading: "### Custom Trigger"
            description: Any other trigger type not listed above.

  example_structure_2: |
    # schema-database.yaml
    # Extension schema for standalone database specs

    extends: schema.yaml

    sections:

      database:
        heading: "## Database"
        aliases: ["## DB", "## Storage"]
        precedence: "functionality.database"
        # Shadows Functionality's ### Database subsection while this
        # extension is loaded -- promoted to a full top-level section
        # (category: design) for specs whose primary purpose is defining
        # a standalone database.
        category: design
        description: >
          Physical storage design owned by this component. Distinct from
          ## Domain (logical model) and from ## External Interfaces
          (a database this component merely connects to but doesn't own).
          May range from engine and database names only to full schema
          definitions. Organized by engine type or by named database.

        organizing_patterns:
          by_engine: |
            ## Database
            ### PostgreSQL
            ### Redis
          by_named_db: |
            ## Database
            ### Orders Database
            MS SQL Server 2019.
            ### Cache
            Redis 7. Session storage and rate limiting.

        inheritable_subsections:
          note: Global defaults at ## Database level, overridden per database block.
          connections:
            heading: "### Connections | Connection"
            description: >
              Strategy, pooling, replicas, failover.
              Placeholders only -- see Secrets Policy.
          migrations:
            heading: "### Migrations"
            description: Tooling and strategy (Flyway, EF Core, Liquibase, Alembic, etc.)

        per_database_subsections:
          schema:             "### Schema | Tables | Collections | Documents"
          indexes:            "### Indexes"
          seeds:
            heading: "### Seeds | Seed Data"
            note: Non-idempotent unless written with upsert/existence checks.
          stored-procedures:  "### Stored Procedures | Stored Procs | Procedures"
          views:              "### Views"
          triggers:           "### Triggers"
          permissions:        "### Permissions | Security"


# ==============================================================================
# ARTIFACTS FOLDER
# ==============================================================================

artifacts:
  folder: ".specmd/"
  note: >
    Committing this folder to version control is optional. Execution plans
    are disposable. The SPEC.md skill can generate an execution plan here
    during the Plan phase, but this is optional -- the user may use their
    own planning skill or workflow instead. No codebase-summary artifact
    is produced; agents are expected to read the codebase directly.
  contents:
    execution_plan: "{spec-id}-plan-{yyyymmdd}-{n}.md -- implementation checklist"