# PLAN.md Schema Definition
# -------------------------
# ID: specmd-plan
# Version: 2026-07-29
#
# PLAN.md is an agent-oriented execution artifact generated from a
# (SPEC.md) file. It captures a concise implementation summary, a complete
# actionable task checklist, implementation notes for assumptions,
# clarifications, and constraints, and (once executed) an implementation
# log of what happened during the run.
#
# Filename: plan-{yyyymmdd}-{n}.md (recommended)
#
# SCHEMA NOTATION
#   type?        = optional
#   [type]       = list of type
#   "a" | "b"    = string enum
#
# SOURCE-OF-TRUTH RULE
#   The plan MUST be derived from the entire source spec, not one section.
#   Items from Requirements, Features, User Stories, UI, API, Database,
#   Testing, Setup, Deployment, and Issues are all in scope.
#
# TASK COMPLETENESS RULE
#   The Tasks section MUST include every actionable change implied by the spec.
#   If an item is intentionally not implemented, it remains listed with an
#   appropriate status marker and explanation in Implementation Notes.

---

# ==============================================================================
# FRONTMATTER
# YAML block between triple-dash fences at the top of the plan file.
# All fields are optional unless noted.
# ==============================================================================

frontmatter:

  id: string?
  # Unique execution plan identifier.
  # Example: "plan-20260729-001"

  description: string?
  # Brief one-line purpose for the plan.
  # Example: "Implement CRM dashboard MVP UI and API wiring."

  generated: string?
  # Date the plan was generated.
  # Format: yyyy-mm-dd

  state: '"ready" | "partial" | "completed" | "blocked"'
  # Overall execution readiness/state for the plan document.
  # - ready:     not yet run.
  # - partial:   a run intentionally covered a subset of tasks; more remain
  #              by design and further runs are expected.
  # - completed: a run finished working its full scope. May carry a trailing
  #              `# see log` comment (e.g. `state: completed  # see log`) when
  #              one or more in-scope tasks remain unresolved -- this is the
  #              run skill's signal that it will not re-attempt automatically;
  #              check Implementation Log for what's outstanding.
  # - blocked:   no progress was possible at all on this invocation.

  spec: string?
  # Optional reference ID of the originating SPEC.md.
  # If there are duplicate IDs across specs, also include the path to the originating SPEC.md to disambiguate.

  metadata:
    author: string?
    updated: string?  # yyyy-mm-dd


# ==============================================================================
# BODY
# Standard markdown following the frontmatter block.
# ==============================================================================

body:

  title:
    format: "# Execution Plan"
    required: true
    note: Canonical heading for plan documents.

  sections:

    summary-of-changes:
      heading: "## Summary of Changes"
      aliases: ["## Summary"]
      required: true
      description: >
        Brief bulleted summary of all major changes, features, and requirements
        to be implemented. Content is extracted from the entire source spec,
        not only Requirements.
      format:
        preferred: markdown bullets
        allowed:
          - "- item"
      rules:
        - "Keep concise and high signal; avoid low-level implementation detail."
        - "Cover major scope across all relevant spec sections."

    tasks:
      heading: "## Tasks"
      aliases:
        - ["## Checklist"]
      required: true
      description: >
        Detailed checklist of every actionable requirement, feature, and change
        to implement from all relevant sections, including UI, API, Database,
        Testing, Setup, Deployment, and related constraints.
      format:
        required_prefixes:
          - "- [ ]"
          - "- [X]"
          - "- [P]"
          - "- [D]"
          - "- [C]"
        id: >
          Each task carries a stable ID immediately after the status marker,
          in the form **T01**, **T02**, ... (sequential, zero-padded to 2
          digits, no gaps). Assigned once when the task is first added;
          never renumbered or reused. Once a plan is generated, tasks are
          never removed from the Tasks section -- a task that turns out
          unneeded or won't be implemented is marked [D] (deferred) with
          the reason recorded in Implementation Notes (if known at
          generation time) or Implementation Log (if discovered during a
          run), not deleted from the checklist. Implementation Log entries
          reference tasks by this ID.
        examples: |
          - [ ] **T01**: Implement customer list page and filters.
          - [X] **T02**: Create API client service and error wrapper.
          - [P] **T03**: Add pagination (UI complete; server cursor handling pending).
          - [D] **T04**: Add SSO integration (deferred to identity milestone).
          - [C] **T05**: Confirm canonical source for exchange rates.
      status_markers:
        "[ ]": Not started
        "[X]": Complete
        "[P]": Partial
        "[D]": Deferred
        "[C]": Clarification needed
      rules:
        - "Every actionable item from the source spec must appear exactly once."
        - "Items may be grouped under '### ' subsection headings (e.g. '### Backend') if helpful. Task bullets stay zero-indent, top-level '- ' items -- never nest a task as an indented sub-bullet under a group label; that breaks task parsing since only top-level '- ' lines are recognized as tasks."
        - "Non-actionable context belongs in Implementation Notes, not Tasks."
        - "Tasks are never removed once the plan is generated -- mark an unneeded or won't-implement task [D] instead of deleting its line, so its ID stays reserved and its status is explained in Implementation Notes or Implementation Log."

    implementation-notes:
      heading: "## Implementation Notes"
      aliases: []
      required: true
      description: >
        Notes for assumptions, clarifications, constraints, deliberate omissions,
        and reasons for each task's *initial* status marker. Authored once when
        the plan is created, before any execution -- not updated afterward.
        Findings, drift, and outcomes discovered while running the plan belong
        in Implementation Log instead, not here.
      format:
        preferred: markdown bullets
      rules:
        - "Document why an item is [D], [P], or [C] when not obvious from task text."
        - "Record key restrictions (technical, policy, environment, ownership)."
        - "Avoid repeating full task text; reference task intent concisely."
        - "Must not use task-style status-marker bullet prefixes ([ ], [X], [P], [D], [C]) -- that syntax is reserved for the Tasks section."

    implementation-log:
      heading: "## Implementation Log"
      aliases: []
      required: false
      description: >
        A running record written during execution (by the run skill) of what
        happened to tasks that didn't reach a clean, caveat-free [X]
        completion -- drift that made a task obsolete, a blocker hit
        mid-implementation, a partial result, etc. Absent from a freshly
        generated plan; created the first time the plan is run.
      format:
        preferred: markdown bullets
      rules:
        - "One entry per task that is not a clean, caveat-free [X] -- reference the task by ID (e.g. **T07**)."
        - "Clean [X] completions and untouched [ ] tasks don't need an entry."
        - "Entries are appended across run invocations, not rewritten -- preserve prior entries."
        - "A closing summary line stating the outcome of the run (state reached, and a pointer to any remaining unresolved tasks) is expected once execution stops."


# ==============================================================================
# COVERAGE MAPPING (GUIDANCE)
# Maps source SPEC.md sections to expected plan outputs.
# ==============================================================================

coverage:
  requirements:
    summary-of-changes: required
    tasks: required
    implementation-notes: optional

  features:
    summary-of-changes: required
    tasks: required

  user-stories:
    summary-of-changes: optional
    tasks: required

  ui:
    summary-of-changes: required when present
    tasks: required when actionable

  api:
    summary-of-changes: required when present
    tasks: required when actionable

  functionality:
    summary-of-changes: required when present
    tasks: required when actionable

  testing:
    summary-of-changes: optional
    tasks: required when explicit or implied by critical/high requirements

  setup:
    tasks: required when setup changes are needed

  deployment:
    tasks: required when deployment changes are in scope

  issues:
    tasks: required for open items when they are in current scope


# ==============================================================================
# VALIDATION CHECKLIST (GUIDANCE)
# ==============================================================================

validation:
  - "Body includes all required sections: Summary of Changes, Tasks, Implementation Notes."
  - "Tasks use only allowed status markers: [ ], [X], [P], [D], [C]."
  - "Each task line carries a stable ID (**T01**, **T02**, ...) immediately after the status marker, with no gaps in the sequence."
  - "Tasks reflect actionable scope across all relevant source spec sections."
  - "Deferred, partial, or unclear items are explained in Implementation Notes."
  - "Implementation Notes contains no task-style status-marker bullet prefixes."
  - "If the plan has been run, tasks not in a clean, caveat-free [X] state have a corresponding Implementation Log entry."
  - "No secrets are included in notes or task text."

# ==============================================================================
# ARTIFACTS FOLDER
# ==============================================================================

artifacts:
  folder: ".specmd/"
  note: >
    Committing this folder to version control is optional. Execution plans
    are disposable. The SPEC.md skill can generate an execution plan here
    during the Plan phase, but this is optional -- the user may use their
    own planning skill or workflow instead. No codebase-summary artifact
    is produced; agents are expected to read the codebase directly.
  contents:
    execution_plan: "{spec-id}-plan-{yyyymmdd}-{n}.md -- implementation checklist"